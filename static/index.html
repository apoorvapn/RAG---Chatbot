<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    /* ── reset & variables ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #22263a;
      --border:      #2e3248;
      --accent:      #6c63ff;
      --accent-glow: #6c63ff55;
      --user-bubble: #6c63ff;
      --bot-bubble:  #22263a;
      --text:        #e8eaf6;
      --text-muted:  #8892b0;
      --green:       #43e97b;
      --radius:      14px;
      --font:        'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── markdown in bot bubbles ────────────────────────────── */
    .bubble.bot-content h1, .bubble.bot-content h2, .bubble.bot-content h3 {
      margin: 10px 0 4px; font-weight: 700;
    }
    .bubble.bot-content p  { margin: 4px 0; }
    .bubble.bot-content ul, .bubble.bot-content ol { padding-left: 20px; margin: 4px 0; }
    .bubble.bot-content li { margin: 2px 0; }
    .bubble.bot-content code {
      background: #0f1117; padding: 2px 6px; border-radius: 5px;
      font-size: 0.85em; font-family: monospace;
    }
    .bubble.bot-content pre {
      background: #0f1117; padding: 12px; border-radius: 8px;
      overflow-x: auto; margin: 8px 0; font-size: 0.83em;
      border: 1px solid var(--border);
    }
    .bubble.bot-content pre code { background: none; padding: 0; }
    .bubble.bot-content strong { font-weight: 700; }
    .bubble.bot-content em { font-style: italic; }
    .bubble.bot-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 10px; color: var(--text-muted); margin: 6px 0;
    }

    /* ── mermaid diagram wrapper ────────────────────────────── */
    .mermaid-wrap {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin: 8px 0;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    .mermaid-wrap svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .mermaid-error {
      background: #2a0a0a; color: #ff6b6b;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.8rem; font-family: monospace;
      border: 1px solid #ff4d4f33; margin: 8px 0;
    }
    .diagram-actions {
      display: flex; justify-content: flex-end; margin-bottom: 4px;
    }
    .copy-btn {
      font-size: 0.7rem; padding: 3px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-muted);
      cursor: pointer; transition: color 0.2s;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── header ────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), #38d9a9);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3px; }
    header p  { font-size: 0.75rem; color: var(--text-muted); }

    #provider-badge {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── chat window ────────────────────────────────────────── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-window::-webkit-scrollbar { width: 5px; }
    #chat-window::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 4px;
    }

    /* ── messages ───────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }
    .msg-row.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot   { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .user .avatar { background: var(--accent); }
    .bot  .avatar { background: var(--surface2); border: 1px solid var(--border); }

    .bubble-wrap { display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 44px); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 0.92rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── sources accordion ──────────────────────────────────── */
    .sources-toggle {
      font-size: 0.73rem;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      user-select: none;
      padding: 2px 0;
      width: fit-content;
      transition: color 0.2s;
    }
    .sources-toggle:hover { color: var(--accent); }
    .sources-toggle .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-style: normal;
    }
    .sources-toggle.open .arrow { transform: rotate(90deg); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }
    .sources-list.open { display: flex; }

    .source-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.75rem;
    }
    .source-item .src-loc {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .source-item .src-preview {
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ── typing indicator ───────────────────────────────────── */
    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── welcome / empty state ──────────────────────────────── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    #welcome .icon {
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    #welcome h2 { font-size: 1.4rem; color: var(--text); }
    #welcome p  { max-width: 380px; font-size: 0.9rem; line-height: 1.6; }

    .suggestion-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .pill {
      padding: 8px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .pill:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    /* ── input bar ──────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      padding: 14px 20px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    #form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #question {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.93rem;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
      padding: 2px 0;
    }
    #question::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
    }
    #send-btn:hover  { opacity: 0.9; transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── error toast ────────────────────────────────────────── */
    #error-toast {
      display: none;
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4d4f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 999;
      animation: fadein 0.3s;
    }
    @keyframes fadein { from { opacity: 0; bottom: 80px; } to { opacity: 1; bottom: 90px; } }

    /* ── responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 10px 16px; }
      #chat-window { padding: 18px 12px; }
      #input-area  { padding: 10px 12px 14px; }
    }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header>
  <div class="logo">🧠</div>
  <div>
    <h1>RAG Chatbot</h1>
    <p>Retrieval-Augmented Generation</p>
  </div>
  <div id="provider-badge">loading…</div>
</header>

<!-- ── Chat window ────────────────────────────────────────────── -->
<div id="chat-window">
  <div id="welcome">
    <div class="icon">💬</div>
    <h2>Ask anything about your docs</h2>
    <p>I'll search your knowledge base and answer using only what's in your documents.</p>
    <div class="suggestion-pills" id="suggestions">
      <div class="pill" onclick="usePill(this)">What is this document about?</div>
      <div class="pill" onclick="usePill(this)">Summarise the key points</div>
      <div class="pill" onclick="usePill(this)">What are the main topics covered?</div>
    </div>
  </div>
</div>

<!-- ── Error toast ────────────────────────────────────────────── -->
<div id="error-toast"></div>

<!-- ── Input area ─────────────────────────────────────────────── -->
<div id="input-area">
  <form id="form" onsubmit="return false;">
    <textarea
      id="question"
      placeholder="Ask a question about your documents…"
      rows="1"
      autocomplete="off"
    ></textarea>
    <button id="send-btn" type="submit" title="Send" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>

<script>
  // ── Init libraries ─────────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose',
  });

  marked.setOptions({ breaks: true, gfm: true });

  // ── State ──────────────────────────────────────────────────────
  const chatWindow  = document.getElementById('chat-window');
  const textarea    = document.getElementById('question');
  const sendBtn     = document.getElementById('send-btn');
  const form        = document.getElementById('form');
  const welcome     = document.getElementById('welcome');
  const errorToast  = document.getElementById('error-toast');
  const provBadge   = document.getElementById('provider-badge');

  let isLoading = false;
  let diagramCounter = 0;

  // ── Fetch provider on load ─────────────────────────────────────
  fetch('/health')
    .then(r => r.json())
    .then(d => { provBadge.textContent = d.provider || 'unknown'; })
    .catch(() => { provBadge.textContent = 'offline'; provBadge.style.color = '#ff4d4f'; });

  // ── Auto-grow textarea ─────────────────────────────────────────
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    sendBtn.disabled = !textarea.value.trim() || isLoading;
  });

  // ── Send on Enter (Shift+Enter = newline) ──────────────────────
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  form.addEventListener('submit', sendMessage);

  // ── Suggestion pills ───────────────────────────────────────────
  function usePill(el) {
    textarea.value = el.textContent;
    textarea.dispatchEvent(new Event('input'));
    textarea.focus();
  }

  // ── Scroll to bottom ───────────────────────────────────────────
  function scrollToBottom() {
    chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
  }

  // ── Show/hide toast ────────────────────────────────────────────
  let toastTimer;
  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { errorToast.style.display = 'none'; }, 4000);
  }

  // ── Render bot answer: extract mermaid blocks, render the rest as markdown ──
  async function renderBotContent(text) {
    // Split on ```mermaid ... ``` blocks
    const parts = text.split(/(```mermaid[\s\S]*?```)/gi);
    const container = document.createElement('div');

    for (const part of parts) {
      const mermaidMatch = part.match(/```mermaid\s*([\s\S]*?)```/i);
      if (mermaidMatch) {
        // ── Render Mermaid diagram ──────────────────────────────
        const code = mermaidMatch[1].trim();
        const id   = `mermaid-diagram-${++diagramCounter}`;
        const wrap = document.createElement('div');

        // Copy button
        const actions = document.createElement('div');
        actions.className = 'diagram-actions';
        actions.innerHTML = `<button class="copy-btn" onclick="copyDiagramCode(this, \`${code.replace(/`/g,'\\`')}\`)">Copy code</button>`;
        wrap.appendChild(actions);

        const diagramEl = document.createElement('div');
        diagramEl.className = 'mermaid-wrap';

        try {
          const { svg } = await mermaid.render(id, code);
          diagramEl.innerHTML = svg;
        } catch (err) {
          diagramEl.className = 'mermaid-error';
          diagramEl.textContent = '⚠️ Diagram render error: ' + err.message + '\n\nRaw:\n' + code;
        }

        wrap.appendChild(diagramEl);
        container.appendChild(wrap);
      } else if (part.trim()) {
        // ── Render as markdown ──────────────────────────────────
        const mdEl = document.createElement('div');
        mdEl.className = 'bubble bot-content';
        mdEl.innerHTML = marked.parse(part);
        container.appendChild(mdEl);
      }
    }
    return container;
  }

  // ── Copy diagram Mermaid code to clipboard ─────────────────────
  function copyDiagramCode(btn, code) {
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '✓ Copied!';
      setTimeout(() => { btn.textContent = 'Copy code'; }, 2000);
    });
  }

  // ── Append a user message bubble ──────────────────────────────
  function appendUserMessage(text) {
    if (welcome) welcome.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar">🧑</div>
      <div class="bubble-wrap">
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  // ── Show typing indicator ──────────────────────────────────────
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble-wrap">
        <div class="typing-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>`;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // ── Append a bot answer bubble with sources ────────────────────
  async function appendBotMessage(answer, sources) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    // Render the answer content (markdown + diagrams)
    const contentEl = await renderBotContent(answer);
    wrap.appendChild(contentEl);

    // Sources accordion
    if (sources.length) {
      const toggle = document.createElement('span');
      toggle.className = 'sources-toggle';
      toggle.innerHTML = `<i class="arrow">▶</i> ${sources.length} source${sources.length > 1 ? 's' : ''} used`;
      toggle.onclick = () => toggleSources(toggle);
      wrap.appendChild(toggle);

      const list = document.createElement('div');
      list.className = 'sources-list';
      list.innerHTML = sources.map(s => `
        <div class="source-item">
          <div class="src-loc">📄 ${escapeHtml(s.location)}</div>
          <div class="src-preview">"${escapeHtml(s.preview)}…"</div>
        </div>`).join('');
      wrap.appendChild(list);
    }

    row.appendChild(avatar);
    row.appendChild(wrap);
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  // ── Toggle sources accordion ───────────────────────────────────
  function toggleSources(el) {
    el.classList.toggle('open');
    el.nextElementSibling.classList.toggle('open');
  }

  // ── Main send function (streaming) ────────────────────────────
  async function sendMessage() {
    const question = textarea.value.trim();
    if (!question || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    textarea.value = '';
    textarea.style.height = 'auto';

    appendUserMessage(question);
    showTyping();

    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';
      let fullText  = '';
      let liveRow   = null;   // the bot message row
      let liveBubble = null;  // the text bubble element
      let sources   = [];

      // ── Helper: create the bot row on first token ─────────────
      function ensureLiveRow() {
        if (liveRow) return;
        hideTyping();
        liveRow = document.createElement('div');
        liveRow.className = 'msg-row bot';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '🤖';

        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap';

        liveBubble = document.createElement('div');
        liveBubble.className = 'bubble bot-content';

        wrap.appendChild(liveBubble);
        liveRow.appendChild(avatar);
        liveRow.appendChild(wrap);
        chatWindow.appendChild(liveRow);
      }

      // ── Read the SSE stream ───────────────────────────────────
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();  // keep any incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const evt = JSON.parse(line.slice(6));

          if (evt.type === 'token') {
            ensureLiveRow();
            fullText += evt.content;
            // Live-render markdown as text streams in
            liveBubble.innerHTML = marked.parse(fullText);
            scrollToBottom();

          } else if (evt.type === 'sources') {
            sources = evt.sources;

          } else if (evt.type === 'error') {
            hideTyping();
            showError('⚠️ ' + evt.content);
            await appendBotMessage('Error: ' + evt.content, []);

          } else if (evt.type === 'done') {
            // Final render: handle mermaid blocks properly
            if (liveRow && fullText) {
              const wrap = liveRow.querySelector('.bubble-wrap');
              // Remove the live text bubble
              wrap.removeChild(liveBubble);
              // Re-render with full Mermaid + markdown support
              const contentEl = await renderBotContent(fullText);
              wrap.insertBefore(contentEl, wrap.firstChild);

              // Append sources accordion
              if (sources.length) {
                const toggle = document.createElement('span');
                toggle.className = 'sources-toggle';
                toggle.innerHTML = `<i class="arrow">▶</i> ${sources.length} source${sources.length > 1 ? 's' : ''} used`;
                toggle.onclick = () => toggleSources(toggle);
                wrap.appendChild(toggle);

                const list = document.createElement('div');
                list.className = 'sources-list';
                list.innerHTML = sources.map(s => `
                  <div class="source-item">
                    <div class="src-loc">📄 ${escapeHtml(s.location)}</div>
                    <div class="src-preview">"${escapeHtml(s.preview)}…"</div>
                  </div>`).join('');
                wrap.appendChild(list);
              }
              scrollToBottom();
            }
          }
        }
      }

      // If nothing came through at all
      if (!liveRow) {
        hideTyping();
        await appendBotMessage("I didn't get a response. Please try again.", []);
      }

    } catch (err) {
      hideTyping();
      showError('⚠️ ' + err.message);
      await appendBotMessage('Sorry, something went wrong: ' + err.message, []);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      textarea.focus();
    }
  }

  // ── XSS-safe HTML escape ───────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Initial focus ──────────────────────────────────────────────
  textarea.focus();
</script>
</body>
</html>
